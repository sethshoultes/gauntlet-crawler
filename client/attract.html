<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Gauntlet Crawler — Attract Mode</title>

<link rel="stylesheet" href="/style.css" />
<style>
  html, body { height: 100%; overflow: hidden; background: #000; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
  #cv { background: #000; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 60px rgba(242,196,0,.06); }

</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="640" height="480"></canvas>
</div>
<div class="sr-only" role="status">Attract mode. Press any key, tap, or click to jump to the game.</div>
<script type="module" src="/attract.js"></script>
</body>
</html>
