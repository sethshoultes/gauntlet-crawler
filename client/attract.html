<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gauntlet Crawler — Attract Mode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%23000%27/%3E%3Crect x=%272%27 y=%270%27 width=%274%27 height=%273%27 fill=%27%23e8c39e%27/%3E%3Crect x=%271%27 y=%273%27 width=%276%27 height=%273%27 fill=%27%23e03c31%27/%3E%3Crect x=%272%27 y=%276%27 width=%272%27 height=%272%27 fill=%27%23000%27/%3E%3C/svg%3E" />
<meta property="og:title" content="Gauntlet Crawler — Attract Mode" />
<meta property="og:description" content="A 1985-style online dungeon crawl for four heroes. Watch the attract loop or jump straight into the lobby." />
<meta property="og:image" content="/media/title-card.webp" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/style.css" />
<style>
  html, body { height: 100%; overflow: hidden; background: #000; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Full-bleed AI-generated backdrop, behind the in-engine canvas. It only shows through the
     letterbox bars #stage/the canvas don't cover; a dim overlay keeps the bitmap title/text
     readable wherever it does. prefers-reduced-motion swaps straight to the static poster via
     CSS alone; attract.js additionally falls back to it if the video can't actually play. */
  #backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  #backdrop video, #backdrop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #backdrop img { display: none; }
  #backdrop::after { content: ''; position: absolute; inset: 0; background: rgba(6,6,12,.6); }
  @media (prefers-reduced-motion: reduce) {
    #backdrop video { display: none; }
    #backdrop img { display: block; }
  }
  #stage { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: transparent; }
  #cv { position: relative; z-index: 1; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 60px rgba(242,196,0,.06); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  #footer-links { position: fixed; right: 10px; bottom: 8px; z-index: 2; font-size: 11px; }
  #footer-links a { color: #5a5870; text-decoration: none; }
  #footer-links a:hover, #footer-links a:focus-visible { color: #f2c400; }
</style>
</head>
<body>
<div id="backdrop" aria-hidden="true">
  <video id="backdrop-video" autoplay loop muted playsinline poster="/media/title-backdrop.webp">
    <source src="/media/title-loop.mp4" type="video/mp4" />
  </video>
  <img id="backdrop-fallback" src="/media/title-backdrop.webp" alt="" />
</div>
<div id="stage">
  <canvas id="cv" width="640" height="480"></canvas>
</div>
<div class="sr-only" role="status">Attract mode. Press any key, tap, or click to jump to the game.</div>
<div id="footer-links"><a href="/trailer.html">Trailer</a></div>
<script type="module" src="/attract.js"></script>
</body>
</html>
