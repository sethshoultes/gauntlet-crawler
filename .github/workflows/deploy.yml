name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main

concurrency: deploy

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST secret is not set; skipping deploy step. Configure DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY repo secrets to enable auto-deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            export BRANCH="${{ github.event.inputs.branch || 'main' }}"
            if [ -f "$HOME/deploy.sh" ]; then bash "$HOME/deploy.sh"; else bash /opt/gauntlet-crawler/deploy/deploy.sh; fi
